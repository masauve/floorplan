apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: floorplan
spec:
  source:
    type: Git
    git:
      uri: https://github.com/masauve/floorplan.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: floorplan:latest
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
  triggers:
    - type: ConfigChange
